services:
  queue:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      - queue-data:/data
    environment:
      QUEUE_TOKEN: ${QUEUE_TOKEN:?Set a freshly generated secret before deployment}
      PYTHONPATH: /app/src
    command: ["sh", "-c", "pip install --no-cache-dir -r requirements-distributed.txt && python -m byte_agent.distributed serve --database /data/jobs.db --host 0.0.0.0 --port 8765"]
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      QUEUE_TOKEN: ${QUEUE_TOKEN:?Set a freshly generated secret before deployment}
      PYTHONPATH: /app/src
    command: ["python", "-m", "byte_agent.distributed", "demo-worker", "--url", "http://queue:8765"]
    depends_on:
      - queue
    restart: unless-stopped
volumes:
  queue-data:
