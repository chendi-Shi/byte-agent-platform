name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[mcp,distributed]'
      - run: python -m unittest discover -s tests -v
      - run: python -m byte_agent demo
      - run: python -m byte_agent dataset --data runs/corpus
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run same-host fixture containers
        run: python examples/container_smoke.py --output runs/container-smoke --jobs 12
      - name: Save actual container result, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: same-host-container-fixture-result
          path: runs/container-smoke/report.json
          if-no-files-found: error
          retention-days: 14
