[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byte-agent-platform"
version = "0.2.0"
description = "ReAct knowledge agent with durable traces and MCP tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
byte-agent = "byte_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
